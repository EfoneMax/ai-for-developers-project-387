name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: npm ci
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - run: mise run check:all
      - name: Lint commit messages
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.event.after }}"
            if [[ "$base" =~ ^0+$ ]]; then
              base="$(git merge-base "origin/${{ github.event.repository.default_branch }}" HEAD || true)"
            fi
          fi

          if [[ -n "$base" ]] && git merge-base --is-ancestor "$base" "$head"; then
            npx --no-install commitlint --from "$base" --to "$head"
          else
            npx --no-install commitlint --last
          fi
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --tag call-booking:ci .

      - name: Start image and check PORT
        shell: bash
        run: |
          docker run --rm --detach --name call-booking-ci --publish 8080:8080 --env PORT=8080 call-booking:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/api/health; then
              exit 0
            fi
            echo "waiting for app: ${attempt}/30"
            sleep 2
          done
          docker logs call-booking-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm --force call-booking-ci 2>/dev/null || true
