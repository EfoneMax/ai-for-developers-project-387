name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    permissions:
      contents: read
      issues: read
      actions: read
      checks: read
      statuses: read
      pull-requests: write
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
       github.event.pull_request.user.login == 'opencode-agent[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Review pull request
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cat > review-prompt.md <<'PROMPT'
          Ты независимый ревьюер pull request #${PR} в репозитории ${REPO}.

          Прочитай AGENTS.md, CODING_STANDARDS.md и REVIEW.md.
          Прочитай описание PR: `gh pr view ${PR} --json title,body,comments`.
          Прочитай спецификацию #7 и согласование объёма в #6:
          `gh issue view 7 --comments` и `gh issue view 6 --comments`.
          Прочитай diff: `git diff ${BASE_SHA}...${HEAD_SHA}`.

          Проверь изменение по критериям REVIEW.md и по согласованной спецификации.
          Оставляй только подтверждённые дефекты. Для каждого укажи файл, строку,
          условие ошибки и последствие. Если подтверждённых дефектов нет — скажи
          это прямо, не выдумывай замечаний. Форматирование проверяет линтер, его
          вывод в ревью не повторяй. Код не меняй и коммиты не создавай.

          Ответь по-русски одним текстом для комментария к PR, структура:
          ## Вердикт
          ## Замечания
          ## Что проверено
          PROMPT

          envsubst "\${PR} \${REPO} \${BASE_SHA} \${HEAD_SHA}" < review-prompt.md > review-prompt-final.md

          opencode run --model deepseek/deepseek-flash "$(cat review-prompt-final.md)" \
            | sed -E 's/\x1B\[[0-9;]*[mK]//g' > review-body.md

          if [ ! -s review-body.md ]; then
            echo "Авторевью не вернуло текст" >&2
            exit 1
          fi

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "**Авторевью · ${HEAD_SHA:0:7}**"
            echo
            cat review-body.md
            echo
            echo "[Прогон](${RUN_URL}) · SHA \`${HEAD_SHA}\`"
          } > comment.md

          gh pr comment "$PR" --body-file comment.md
